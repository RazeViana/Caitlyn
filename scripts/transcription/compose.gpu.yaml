# @file compose.gpu.yaml
# @description Adds a single explicitly selected NVIDIA GPU to the offline speech worker.
# @module transcriptionGpuCompose
services:
  transcription:
    build:
      target: cuda
    image: caitlyn-transcription:base-en-cuda
    environment:
      TRANSCRIPTION_DEVICE: cuda
      TRANSCRIPTION_COMPUTE_TYPE: int8_float32
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TRANSCRIPTION_GPU_ID:-0}"]
              capabilities: [gpu]
