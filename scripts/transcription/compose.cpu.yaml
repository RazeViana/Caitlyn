# @file compose.cpu.yaml
# @description Provides an explicit CPU-only alternative for the local speech worker.
# @module transcriptionCpuCompose
services:
  transcription:
    build:
      context: .
      target: cpu
      args:
        WHISPER_MODEL: base.en
        WHISPER_MODEL_REVISION: 3d3d5dee26484f91867d81cb899cfcf72b96be6c
    image: caitlyn-transcription:base-en
    environment:
      TRANSCRIPTION_DEVICE: cpu
      TRANSCRIPTION_COMPUTE_TYPE: int8
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [transcription]
networks:
  transcription:
    name: caitlyn-transcription
    internal: true
