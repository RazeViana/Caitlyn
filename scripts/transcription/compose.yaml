# @file compose.yaml
# @description Runs local speech recognition on Mainframe's selected NVIDIA GPU over an internal network.
# @module transcriptionCompose
services:
  transcription:
    build:
      context: .
      target: cuda
      args:
        WHISPER_MODEL: base.en
    image: caitlyn-transcription:base-en-cuda
    environment:
      TRANSCRIPTION_DEVICE: cuda
      TRANSCRIPTION_COMPUTE_TYPE: int8_float32
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TRANSCRIPTION_GPU_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [transcription]
networks:
  transcription:
    name: caitlyn-transcription
    internal: true
