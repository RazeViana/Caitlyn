# @file compose.yaml
# @description Runs local speech recognition on Mainframe's selected NVIDIA GPU over an internal network.
# @module transcriptionCompose
services:
  transcription:
    build:
      context: .
      target: cuda
      args:
        WHISPER_MODEL: large-v3
        WHISPER_MODEL_REVISION: edaa852ec7e145841d8ffdb056a99866b5f0a478
    image: caitlyn-transcription:large-v3-cuda
    environment:
      TRANSCRIPTION_DEVICE: cuda
      TRANSCRIPTION_COMPUTE_TYPE: float32
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TRANSCRIPTION_GPU_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [transcription]
networks:
  transcription:
    name: caitlyn-transcription
    internal: true
